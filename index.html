<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المحتوى والأدوات</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            padding-bottom: 90px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container { width: 100%; max-width: 700px; text-align: center; }
        h1 { color: var(--accent); margin-bottom: 5px; font-size: 2rem; }
        .subtitle { color: var(--text-sub); font-size: 0.95rem; margin-bottom: 25px; }
        .search-box {
            width: 100%; padding: 12px 20px; border-radius: 25px;
            border: 1px solid var(--border); background-color: var(--card-bg);
            color: var(--text); font-size: 1rem; box-sizing: border-box; margin-bottom: 30px; text-align: center;
        }
        .posts-list { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .card {
            background-color: var(--card-bg); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; text-align: right; cursor: pointer;
            transition: transform 0.2s;
        }
        .card:hover { transform: translateY(-2px); }
        .card-badge {
            display: inline-block; background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent); font-size: 0.8rem; padding: 4px 10px; border-radius: 15px; margin-bottom: 10px;
        }
        .card-img { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
        .card h3 { margin: 0 0 10px 0; color: #fff; }
        .card p { color: var(--text-sub); line-height: 1.6; margin: 0; }
        
        .sticky-ad-bar {
            position: fixed; bottom: 0; left: 0; width: 100%; min-height: 50px;
            background-color: var(--card-bg); border-top: 1px solid var(--border);
            display: flex; justify-content: center; align-items: center; padding: 5px 0; z-index: 9999;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5); overflow: hidden;
        }
        .sticky-ad-bar iframe { background-color: transparent !important; border: none !important; }

        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;
        }
        .modal-content {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
            max-width: 600px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 25px; text-align: right; position: relative;
        }
        .close-btn { position: absolute; top: 15px; left: 20px; font-size: 1.5rem; color: var(--text-sub); cursor: pointer; }
        .modal-img { width: 100%; max-height: 300px; object-fit: cover; border-radius: 8px; margin: 15px 0; }
        .modal-body { color: var(--text); line-height: 1.8; white-space: pre-wrap; margin-bottom: 20px; }
        .modal-link {
            width: 100%; background: var(--accent); color: #0f172a; padding: 14px;
            border-radius: 8px; font-weight: bold; border: none; cursor: pointer; font-size: 1rem; transition: all 0.2s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>منصة المحتوى والأدوات</h1>
        <p class="subtitle">تصفح أحدث الأدوات والمقالات المنشورة داخل المنصة</p>
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن مقال أو أداة..." oninput="filterPosts()">
        <div id="postsContainer" class="posts-list">جاري التحميل...</div>
    </div>

    <div id="articleModal" class="modal" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <span id="modalCategory" class="card-badge"></span>
            <h2 id="modalTitle" style="color:#fff; margin-top:10px;"></h2>
            <img id="modalImage" class="modal-img" style="display:none;">
            <p id="modalContent" class="modal-body"></p>
            <div id="modalLinkContainer"></div>
        </div>
    </div>

    <!-- شريط الإعلان الثابت في الأسفل -->
    <div class="sticky-ad-bar">
        <script type="text/javascript">
          atOptions = {
            'key' : '315034ef74b73b3311263b37af75e361',
            'format' : 'iframe',
            'height' : 50,

          };
        </script>
        <script type="text/javascript" src="https://www.highrevenueformat.com/315034ef74b73b3311263b37af75e361/invoke.js"></script>
    </div>

    <script src="ai_channel_website.js"></script>

    <script src="https://pl31360206.profitableratecpmnetwork.com/16/b3/5e/16b35e0fce468b7cd70d6d95ceef5485.js"></script>
</body>
</html>
