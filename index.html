<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المحتوى والأدوات</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 700px;
            text-align: center;
        }
        h1 { color: var(--accent); margin-bottom: 5px; font-size: 2rem; }
        .subtitle { color: var(--text-sub); font-size: 0.95rem; margin-bottom: 25px; }
        .search-box {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 1px solid var(--border);
            background-color: var(--card-bg);
            color: var(--text);
            font-size: 1rem;
            box-sizing: border-box;
            margin-bottom: 30px;
            text-align: center;
        }
        .posts-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            text-align: right;
        }
        .card-badge {
            display: inline-block;
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            font-size: 0.8rem;
            padding: 4px 10px;
            border-radius: 15px;
            margin-bottom: 10px;
        }
        .card h3 { margin: 0 0 10px 0; color: #fff; }
        .card p { color: var(--text-sub); line-height: 1.6; margin: 0 0 15px 0; white-space: pre-wrap; }
        .card a {
            display: inline-block;
            background-color: var(--accent);
            color: #0f172a;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
        }
        footer {
            margin-top: auto;
            padding-top: 40px;
            color: var(--text-sub);
            font-size: 0.8rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>منصة المحتوى والأدوات</h1>
        <p class="subtitle">تصفح أحدث الأدوات والمقالات المنشورة داخل المنصة</p>
        
        <input type="text" id="searchInput" class="search-box" placeholder="🔍 ابحث عن مقال أو أداة..." oninput="filterPosts()">
        
        <div id="postsContainer" class="posts-list">
            <p style="color: var(--text-sub);">جاري الاتصال بالسحاب...</p>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة - تحديث مباشر</footer>

    <script src="ai_channel_website.js"></script>
</body>
</html>
