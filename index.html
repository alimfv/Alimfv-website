<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة المحتوى والأدوات</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #1e293b;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            text-align: center;
            padding: 50px 20px 30px;
            background: linear-gradient(to bottom, #111827, var(--bg-color));
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            color: var(--primary);
            font-size: 2.2rem;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        header p {
            color: var(--text-sub);
            font-size: 1rem;
            margin-bottom: 25px;
        }

        /* شريط البحث */
        .search-container {
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px;
            padding-right: 45px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .search-icon {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            font-size: 1.1rem;
            pointer-events: none;
        }

        main {
            max-width: 1000px;
            width: 100%;
            margin: 0 auto;
            padding: 40px 20px;
            flex: 1;
        }

        .posts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
        }

        .post-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s ease, border-color 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .post-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
        }

        .post-card h3 {
            color: var(--text-main);
            font-size: 1.25rem;
            margin-bottom: 8px;
        }

        .post-card .date {
            font-size: 0.8rem;
            color: var(--primary);
            margin-bottom: 12px;
            font-weight: 500;
        }

        .post-card p {
            color: var(--text-sub);
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 20px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .btn-read {
            background: rgba(56, 189, 248, 0.1);
            color: var(--primary);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 10px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            width: 100%;
            transition: background 0.2s ease;
        }

        .btn-read:hover {
            background: var(--primary);
            color: #0b0f19;
        }

        .no-posts {
            text-align: center;
            color: var(--text-sub);
            grid-column: 1 / -1;
            padding: 40px;
            font-size: 1.1rem;
        }

        /* نافذة عرض المقال الكامل (Modal) */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            max-width: 650px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-content h2 {
            color: var(--primary);
            margin-bottom: 8px;
            font-size: 1.5rem;
            padding-left: 40px;
        }

        .modal-content .modal-date {
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .modal-content .modal-body {
            line-height: 1.8;
            color: var(--text-main);
            white-space: pre-wrap;
            font-size: 1.02rem;
        }

        .btn-close {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(239, 68, 68, 0.1);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-close:hover {
            background: #ef4444;
            color: white;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: var(--text-sub);
            font-size: 0.85rem;
            border-top: 1px solid var(--border);
            background: #111827;
        }
    </style>
</head>
<body>

    <header>
        <h1>منصة المحتوى والأدوات</h1>
        <p>تصفح أحدث الأدوات والمقالات المنشورة بداخل المنصة</p>
        
        <!-- شريط البحث -->
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" class="search-input" placeholder="ابحث عن مقال أو أداة..." oninput="filterPosts()">
        </div>
    </header>

    <main>
        <div id="postsContainer" class="posts-grid"></div>
    </main>

    <!-- نافذة قراءة المقال الكامل -->
    <div id="articleModal" class="modal-overlay">
        <div class="modal-content">
            <button class="btn-close" onclick="closeModal()">إغلاق ✕</button>
            <h2 id="modalTitle"></h2>
            <div id="modalDate" class="modal-date"></div>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <footer>
        © جميع الحقوق محفوظة — تحديث مباشر
    </footer>

    <script src="ai_channel_website.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            renderPublicPosts();
        });
    </script>
</body>
</html>
