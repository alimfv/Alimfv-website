<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
        }
        body { background-color: var(--bg-color); color: var(--text); font-family: system-ui, sans-serif; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .panel { width: 100%; max-width: 600px; background-color: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 25px; box-sizing: border-box; }
        h2 { color: var(--accent); margin-top: 0; text-align: center; }
        label { display: block; margin-top: 15px; margin-bottom: 5px; font-weight: bold; font-size: 0.9rem; }
        input, select, textarea {
            width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);
            background-color: #0f172a; color: var(--text); box-sizing: border-box; font-size: 0.95rem;
        }
        textarea { height: 120px; resize: vertical; }
        button {
            width: 100%; padding: 14px; margin-top: 20px; background-color: var(--accent);
            color: #0f172a; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer;
        }
        #statusMsg { text-align: center; margin-top: 15px; font-weight: bold; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 12px; border-radius: 8px; margin-top: 10px; border: 1px solid var(--border); }
        .del-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; width: auto; margin: 0; }
    </style>
</head>
<body>
    <div class="panel">
        <h2>نشر محتوى جديد</h2>
        
        <label>عنوان المقال أو الأداة:</label>
        <input type="text" id="postTitle" placeholder="أدخل العنوان...">

        <label>القسم:</label>
        <select id="postCategory">
            <option value="أدوات ذكاء اصطناعي">أدوات ذكاء اصطناعي</option>
            <option value="قصص وروايات">قصص وروايات</option>
            <option value="شروحات وتقنية">شروحات وتقنية</option>
            <option value="عام">عام</option>
        </select>

        <label>رابط الصورة (اختياري):</label>
        <input type="text" id="postImage" placeholder="https://example.com/image.jpg">

        <label>المحتوى النصي الكامل:</label>
        <textarea id="postContent" placeholder="اكتب النص أو الشرح كاملاً هنا..."></textarea>

        <label>رابط فرعي / أداة (اختياري):</label>
        <input type="text" id="postLink" placeholder="https://...">

        <button onclick="publishPost()">نشر فوراً إلى الموقع</button>
        <div id="statusMsg"></div>

        <hr style="border-color: var(--border); margin: 30px 0;">
        <h3>المحتوى المنشور حالياً:</h3>
        <div id="adminPostsList">جاري التحميل...</div>
    </div>

    <script src="ai_channel_website.js"></script>
</body>
</html>
