<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - إدارة المقالات</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f8fafc;
            --border: #334155;
        }
        body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; padding: 20px; max-width: 650px; margin: 0 auto; }
        h1 { color: var(--accent); text-align: center; }
        .form-group { margin-bottom: 15px; text-align: right; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); color: #fff; box-sizing: border-box; }
        textarea { height: 120px; resize: vertical; }
        button.btn-add { width: 100%; padding: 12px; background: #22c55e; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .post-item { background: var(--card); border: 1px solid var(--border); padding: 15px; border-radius: 8px; margin-top: 12px; display: flex; justify-content: space-between; align-items: center; }
        .btn-del { background: #ef4444; color: #fff; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <h1>🛠️ لوحة تحكم المقالات والأدوات</h1>
    <form id="addPostForm">
        <div class="form-group">
            <label>عنوان المقال / الأداة:</label>
            <input type="text" id="title" required placeholder="مثال: أداة صانع المانجا">
        </div>
        <div class="form-group">
            <label>القسم:</label>
            <input type="text" id="category" placeholder="مثال: أدوات ذكاء اصطناعي">
        </div>
        <div class="form-group">
            <label>صورة المقال (رابط URL اختياري):</label>
            <input type="url" id="image" placeholder="https://example.com/image.png">
        </div>
        <div class="form-group">
            <label>رابط الأداة المباشر:</label>
            <input type="url" id="link" required placeholder="https://example.com">
        </div>
        <div class="form-group">
            <label>الشرح / المحتوى:</label>
            <textarea id="content" required placeholder="اكتب شرح الأداة هنا..."></textarea>
        </div>
        <button type="submit" class="btn-add">➕ نشر المقال جديد</button>
    </form>

    <h2 style="margin-top: 30px; text-align: right;">📋 المقالات المنشورة حالياً</h2>
    <div id="adminPostsList"></div>

    <script>
        let posts = JSON.parse(localStorage.getItem('my_website_posts')) || [];

        function renderAdminPosts() {
            const list = document.getElementById('adminPostsList');
            if (posts.length === 0) {
                list.innerHTML = '<p style="color:#94a3b8; text-align:center;">لا توجد مقالات حالياً.</p>';
                return;
            }
            list.innerHTML = posts.map(p => `
                <div class="post-item">
                    <div>
                        <strong style="color:#fff;">${p.title}</strong>
                        <div style="font-size:0.85rem; color:#94a3b8;">${p.category || 'عام'}</div>
                    </div>
                    <button class="btn-del" onclick="deletePost(${p.id})">🗑️ حذف</button>
                </div>
            `).join('');
        }

        document.getElementById('addPostForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const newPost = {
                id: Date.now(),
                title: document.getElementById('title').value,
                category: document.getElementById('category').value || 'أدوات',
                image: document.getElementById('image').value,
                link: document.getElementById('link').value,
                content: document.getElementById('content').value
            };
            posts.unshift(newPost);
            localStorage.setItem('my_website_posts', JSON.stringify(posts));
            document.getElementById('addPostForm').reset();
            renderAdminPosts();
            alert('تم نشر المقال بنجاح!');
        });

        function deletePost(id) {
            if (confirm('هل أنت متأكد من حذف هذا المقال؟')) {
                posts = posts.filter(p => p.id !== id);
                localStorage.setItem('my_website_posts', JSON.stringify(posts));
                renderAdminPosts();
            }
        }

        renderAdminPosts();
    </script>
</body>
</html>
